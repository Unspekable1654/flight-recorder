<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 606" width="780" height="606" role="img" aria-label="flight-recorder demo: the evidence pipeline sealing, signing and verifying a capture, then detecting tampering">
<title>flight-recorder demo</title>
