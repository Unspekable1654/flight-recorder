name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write     # keyless signing via Sigstore/Fulcio
  attestations: write # SLSA provenance

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Binaries
  # ---------------------------------------------------------------------------
  binaries:
    name: binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Only the Linux builds ever attach to a kernel, so only they need the
      # eBPF toolchain. Acquisition is Linux-only, but the evidence pipeline
      # that seals, signs, encrypts and verifies is pure userspace and builds
      # for macOS and Windows from the committed sources alone.
      - name: Install the eBPF toolchain
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Generate eBPF bindings
        if: matrix.goos == 'linux'
        run: |
          BPF_CLANG=clang \
          BPF_CFLAGS="-O2 -g -Wall -Werror -D__TARGET_ARCH_x86" \
          go generate ./pkg/probe/...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ inputs.tag }}}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=github.com/Unspekable1654/flight-recorder
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          echo "EXT=${EXT}" >> "$GITHUB_ENV"
          go build -trimpath -ldflags "-s -w \
            -X ${MODULE}/pkg/version.Version=${VERSION} \
            -X ${MODULE}/pkg/version.Commit=${COMMIT} \
            -X ${MODULE}/pkg/version.BuildDate=${BUILD_DATE}" \
            -o "flight-recorder-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/flight-recorder
          ls -la "flight-recorder-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ inputs.tag }}}
          NAME="flight-recorder-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          STAGE="pkg-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$STAGE"
          cp "$NAME" "$STAGE/flight-recorder${EXT}"
          cp LICENSE NOTICE README.md SECURITY.md "$STAGE/"
          cp -r deploy "$STAGE/"
          # The sample bundle travels with the archive so a new user can run
          # `verify` against real output before capturing anything themselves.
          cp -r examples "$STAGE/"
          ARCHIVE="flight-recorder_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd "$STAGE" && zip -qr "../${ARCHIVE}.zip" .)
            ARCHIVE="${ARCHIVE}.zip"
          else
            tar czf "${ARCHIVE}.tar.gz" -C "$STAGE" .
            ARCHIVE="${ARCHIVE}.tar.gz"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          # The binary's own digest is what a verifier compares against the
          # tool_self_sha256 field recorded inside every evidence bundle.
          sha256sum "$NAME" > "${NAME}.sha256"
          cat "${NAME}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            flight-recorder_*_${{ matrix.goos }}_${{ matrix.goarch }}.*
            flight-recorder-${{ matrix.goos }}-${{ matrix.goarch }}*.sha256

  # ---------------------------------------------------------------------------
  # Container image, signed and attested
  # ---------------------------------------------------------------------------
  image:
    name: container image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Normalise the image reference
        id: ref
        run: |
          # OCI references must be lowercase, but github.repository preserves
          # the owner's capitalisation. docker/metadata-action normalises its
          # own tags, which is why the push succeeds and only signing breaks.
          echo "image=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign the image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Signing our own build pipeline, not just our users' evidence: the
          # signature proves this image came from this workflow, from this
          # commit, and is recorded in the Rekor transparency log.
          cosign sign --yes \
            "${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # SBOM
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    needs: [image]
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: flight-recorder.cdx.json
          output-file: flight-recorder.cdx.json

      - name: Generate an SPDX SBOM as well
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: flight-recorder.spdx.json
          output-file: flight-recorder.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            flight-recorder.cdx.json
            flight-recorder.spdx.json

  # ---------------------------------------------------------------------------
  # GitHub release
  # ---------------------------------------------------------------------------
  release:
    name: github release
    runs-on: ubuntu-24.04
    needs: [binaries, image, sbom]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fetch only what the release needs. Downloading everything also pulls
      # the multi-hundred-megabyte .dockerbuild record that build-push-action
      # uploads, which is both pointless here and the artifact that flaked.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: sbom

      - name: Collect artefacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) \
            -exec cp {} release/ \;
          ls -la release
          # A release with no binaries would be worse than a failed job.
          test -n "$(ls -A release)" || { echo "error: no artefacts collected"; exit 1; }
          # Every advertised platform must actually be present.
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            ls release/ | grep -q "_${target}\." || { echo "error: no archive for ${target}"; exit 1; }
          done

      - name: Assemble the single-file Kubernetes manifest
        run: |
          # The release notes have always pointed at deploy.yaml; nothing built
          # it, so that link 404'd. Concatenate the manifests in apply order.
          {
            echo "# Flight Recorder ${GITHUB_REF_NAME} - generated from deploy/k8s, do not edit."
            echo "#"
            echo "# A signing key must exist before this is applied:"
            echo "#   kubectl -n flight-recorder create secret generic flight-recorder-signing-key --from-file=key.pem"
            for f in deploy/k8s/rbac.yaml deploy/k8s/configmap.yaml deploy/k8s/daemonset.yaml; do
              echo "---"
              cat "$f"
            done
          } > release/deploy.yaml
          grep -q "hostPID: true" release/deploy.yaml
          grep -q "SYS_PTRACE" release/deploy.yaml
          wc -l release/deploy.yaml

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Try it in one minute, on any operating system

            Download the archive for your machine below, unpack it, and run:

            ```
            flight-recorder demo
            ```

            That runs the complete evidence pipeline against a synthetic
            capture — Merkle seal, ECDSA signature, CASE/UCO rendering,
            zstd compression, AES-256-GCM encryption, then verification — and
            finishes by flipping a single byte and showing verification
            correctly fail. No kernel, no root and no cluster required, and it
            works on Windows and macOS as well as Linux.

            Live memory acquisition (`capture` and `start`) does require
            Linux: it is built on eBPF and `process_vm_readv(2)`.

            Every archive also carries `examples/`, a sealed sample bundle you
            can verify straight away, with only the public key:

            ```
            flight-recorder verify --bundle examples/demo-bundle --key examples/demo-pub.pem
            ```

            ## Which file do I want?

            | Your machine | Download |
            |---|---|
            | Windows | `..._windows_amd64.zip` |
            | Mac (Apple silicon) | `..._darwin_arm64.tar.gz` |
            | Mac (Intel) | `..._darwin_amd64.tar.gz` |
            | Linux | `..._linux_amd64.tar.gz` |

            ## Verifying this release

            Every artefact below is reproducible from the tagged source and
            attested by the build pipeline.

            Container image:
            ```
            cosign verify ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Binary:
            ```
            sha256sum -c flight-recorder-linux-amd64.sha256
            ```

            The binary digest above is the value recorded as `tool_self_sha256`
            in every evidence bundle this build produces, which is how an
            examiner ties a piece of evidence to an exact, published artefact.

            ## Deploying

            ```
            helm install flight-recorder oci://ghcr.io/${{ github.repository }}/charts/flight-recorder \
              --version ${{ github.ref_name }} --namespace flight-recorder --create-namespace
            ```

            or with the raw manifests:

            ```
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deploy.yaml
            ```

  # ---------------------------------------------------------------------------
  # Helm chart to the OCI registry
  # ---------------------------------------------------------------------------
  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    needs: [image]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package and push
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package deploy/helm/flight-recorder \
            --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          helm push "flight-recorder-${VERSION}.tgz" "oci://${REGISTRY}/${REPO_LC}/charts"
